name: rust-build

on:
  push:
    branches: [main]
    paths:
      - 'packages/rust/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/rust/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: build
        run: cargo build
      - name: test
        run: cargo test
