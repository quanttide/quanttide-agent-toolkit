name: rust-publish

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/rust/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: validate version
        run: |
          VERSION="${GITHUB_REF_NAME#rust/}"
          VERSION="${VERSION#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "version mismatch: tag=$VERSION cargo=$CARGO_VERSION" >&2
            exit 1
          fi
      - name: publish to crates.io
        run: cargo publish --allow-dirty --token ${{ secrets.CRATES_API_TOKEN }}
